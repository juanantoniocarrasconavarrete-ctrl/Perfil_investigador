<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escena</title>
<style>html,body{margin:0;background:#0f172a}svg{display:block;width:100vw;height:100vh}</style>
</head><body>
<!-- Contrato: window.CFG + window.renderAt(t). renderAt debe ser PURA (sin Math.random/Date.now). -->
<svg id="lienzo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"></svg>
<script>
window.CFG = { fps: 30, duracion: 6, ancho: 1280, alto: 720 };

// ---- utilidades ----
const ease = {
  lineal: x => x,
  salida: x => 1 - Math.pow(1 - x, 3),
  entrada: x => x * x * x,
  suave: x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2,
  rebote: x => { const n=7.5625,d=2.75; if(x<1/d)return n*x*x; if(x<2/d)return n*(x-=1.5/d)*x+.75; if(x<2.5/d)return n*(x-=2.25/d)*x+.9375; return n*(x-=2.625/d)*x+.984375; }
};
const tramo = (t, ini, dur, f = ease.suave) => f(Math.min(1, Math.max(0, (t - ini) / dur)));
const lerp = (a, b, k) => a + (b - a) * k;
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('lienzo');

// ---- escena de ejemplo: BSC animado (4 perspectivas) ----
const PERSP = [['Finanzas','#22c55e'],['Cliente','#3b82f6'],['Procesos','#f59e0b'],['Aprendizaje','#a855f7']];
svg.innerHTML = `
  <rect width="1280" height="720" fill="#0f172a"/>
  <text id="titulo" x="640" y="110" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="700" fill="#f8fafc">Balanced Scorecard</text>
  ${PERSP.map((p,i)=>`<g id="p${i}"><rect x="${140+i*270}" y="260" width="220" height="220" rx="24" fill="${p[1]}"/>
    <text x="${250+i*270}" y="385" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#0f172a">${p[0]}</text></g>`).join('')}
  <path id="flecha" d="M140 560 H1140" stroke="#f8fafc" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="1000" stroke-dashoffset="1000"/>
  <text id="pie" x="640" y="630" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#cbd5e1" opacity="0">Causa → efecto: aprendizaje impulsa procesos, clientes y finanzas</text>`;
const $ = id => svg.querySelector('#' + id);

window.renderAt = function (t) {
  $('titulo').setAttribute('opacity', tramo(t, 0, .6));
  $('titulo').setAttribute('transform', `translate(0 ${lerp(-30, 0, tramo(t, 0, .6, ease.salida))})`);
  PERSP.forEach((_, i) => {
    const k = tramo(t, .8 + i * .5, .7, ease.rebote);
    $('p' + i).setAttribute('opacity', Math.min(1, k * 2));
    $('p' + i).setAttribute('transform', `translate(${140+i*270+110} 370) scale(${k}) translate(${-(140+i*270+110)} -370)`);
  });
  $('flecha').setAttribute('stroke-dashoffset', 1000 * (1 - tramo(t, 3.2, 1.6, ease.suave)));
  $('pie').setAttribute('opacity', tramo(t, 4.8, .8));
};
window.renderAt(0);
</script></body></html>
