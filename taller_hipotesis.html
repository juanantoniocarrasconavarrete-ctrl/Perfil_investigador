<script>
'use strict';
/* ================= ESTADO ================= */
const KEY='lab_hipotesis_duoc_v2';
const CLASES=['Dato real','Registro de observación','Documento o estudio','Ilustración','Escenario hipotético'];
const ATIPOS=['Observación','Interpretación','Supuesto','Predicción'];
const blank=()=>({stage:0,modo:'guiada',ctab:'mapa',enfoque:'causal',
 ui:{lvl:'cot',pin:false,alt:false,cmpA:0,cmpB:0,rechaz:false},
 p:{ocurre:'',porque:''},afirm:[{t:'',tipo:'Observación'}],
 ctx:{donde:'',cuando:'',circ:''},actores:[{n:'',rol:'',cons:''}],
 evid:[{desc:'',fuente:'',tipo:'Documento',clase:'Documento o estudio',vinc:''}],falta:'',
 factores:[{t:'',rel:'explorar'}],consec:[{t:'',actor:''}],pregunta:'',pregTipo:'',
 h:{texto:'',nula:'',cot:''},
 c:{unidad:'',tiempo:'',x:'',y:'',dir:'',mec:'',conf:'',fund:'',x_ind:'',x_inst:'',y_ind:'',y_inst:'',y_esc:'',refuta:'',alcance:'',limit:''},
 sup:[],
 vis:{img:'',imgTipo:'Ilustración',imgNota:'',pins:[],pasos:[{t:''},{t:''}],actual:'',posible:'',snap:null},
 con:{datos:'',muestra:'',analisis:'',viab:'',riesgos:'',priv:''},
 esc:{compat:'',cuestiona:'',mixto:'',alterna:'',imprev:''},
 sim:{pred:null,res:null,expl:'',n:30,d:0.6,gamma:0.8,kappa:1,runs:1500,alpha:0.05,seed:11},
 rev:{},tdec:{},ayuda:{ok:0,no:0,mod:0,alt:0},
 vers:[],vcambio:'',vcoment:'',vfund:'',refl:{a:'',b:'',c:'',d:'',e:''}});
let S=blank();
function merge(t,s){for(const k in s){if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])&&t[k]&&typeof t[k]==='object'&&!Array.isArray(t[k]))merge(t[k],s[k]);else t[k]=s[k]}return t}
function load(){try{const r=localStorage.getItem(KEY);if(r)S=merge(blank(),JSON.parse(r))}catch(e){}}
let svT;function save(){clearTimeout(svT);svT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));st('Guardado en este navegador')}catch(e){st('No se pudo guardar: descarga el JSON')}},250)}
function st(m){const e=document.getElementById('status');if(e)e.textContent=m}
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=p=>p.split('.').reduce((o,k)=>o==null?o:o[k],S);
function setp(p,v){const k=p.split('.');let o=S;for(let i=0;i<k.length-1;i++){if(o[k[i]]==null)o[k[i]]={};o=o[k[i]]}o[k[k.length-1]]=v}
const ne=(a,k)=>a.filter(x=>x[k]&&String(x[k]).trim());

/* ================= TEXTO ================= */
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const STOP=new Set('el la los las un una unos unas de del al en y o u que se con por para su sus es son ser como entre sobre este esta estos estas lo le les ya si tiene tienen hay'.split(' '));
const toks=s=>norm(s).replace(/[^a-z0-9ñ ]/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOP.has(w)).map(w=>w.length>5?w.slice(0,5):w);
const wc=s=>(s||'').trim()?s.trim().split(/\s+/).length:0;
function ovl(a,b){const ta=toks(a);if(!ta.length)return 0;const tb=new Set(toks(b));return ta.filter(x=>tb.has(x)).length/ta.length}
const VAGUE=['mejora','mejoran','mejoras','mejorar','mejorara','mejor','mejores','impacto','impactos','impactar','adecuado','adecuada','eficiente','eficaz','efectivo','efectiva','positivo','positiva','positivamente','influye','influyen','influencia','afecta','afectan','afectar','calidad','bueno','buena'];
const CONSTR=['salud','bienestar','desempeno','rendimiento','satisfaccion','motivacion','aprendizaje','seguridad','productividad','clima','cultura'];
const POSW=['mas','mayor','mayores','aumenta','aumentan','sube','suben','incrementa','superior','aumento'];
const NEGW=['menos','menor','menores','disminuye','disminuyen','reduce','reducen','baja','bajan','inferior','reduccion','disminucion'];
const CAUSAL=['causa','provoca','produce','genera','origina','hace que','debido a','por culpa','gracias a','efecto de','efecto sobre'];
const foundExact=(t,l)=>{const tk=new Set(norm(t).replace(/[^a-z0-9 ]/g,' ').split(/\s+/));return l.filter(w=>tk.has(w))};
const trunc=(s,n)=>{s=(s||'').trim();return s.length>n?s.slice(0,n-1)+'…':s};
function wrap(t,max,lines){t=(t||'').trim();const w=t.split(/\s+/),o=[];let cur='';for(const x of w){if((cur+' '+x).trim().length>max&&cur){o.push(cur);cur=x}else cur=(cur+' '+x).trim()}if(cur)o.push(cur);if(o.length>lines){o.length=lines;o[lines-1]=trunc(o[lines-1],max-1)+'…'}return o}
const vagueIn=t=>foundExact((t||'').replace(/\S+\s*\(medida como:[^)]*\)/gi,' '),VAGUE);
const lines=s=>(s||'').split(/[\n;]+/).map(x=>x.trim()).filter(Boolean);

/* ================= ESTADÍSTICA (validada contra valores de referencia) ================= */
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mkN(r){let s=null;return()=>{if(s!==null){const v=s;s=null;return v}let u=0;while(u===0)u=r();const v=r(),m=Math.sqrt(-2*Math.log(u));s=m*Math.sin(2*Math.PI*v);return m*Math.cos(2*Math.PI*v)}}
function lgamma(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,t=x+5.5;t-=(x+0.5)*Math.log(t);let s=1.000000000190015;for(let j=0;j<6;j++){y+=1;s+=c[j]/y}return -t+Math.log(2.5066282746310005*s/x)}
function betacf(a,b,x){const F=1e-300;let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<F)d=F;d=1/d;let h=d;for(let m=1;m<=200;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<F)d=F;c=1+aa/c;if(Math.abs(c)<F)c=F;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<F)d=F;c=1+aa/c;if(Math.abs(c)<F)c=F;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-10)break}return h}
function ibeta(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b}
const pT=(t,df)=>ibeta(df/(df+t*t),df/2,0.5);
function qt975(df){let lo=0,hi=50;for(let i=0;i<50;i++){const m=(lo+hi)/2;if(pT(m,df)>0.05)lo=m;else hi=m}return(lo+hi)/2}
function invN(p){const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00],b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01],c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00],d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];let q,r;if(p<0.02425){q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}if(p>1-0.02425){q=Math.sqrt(-2*Math.log(1-p));return-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}q=p-0.5;r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1)}
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
const vari=(a,m)=>a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1);
function welch(a,b){const n1=a.length,n2=b.length,m1=mean(a),m2=mean(b),v1=vari(a,m1),v2=vari(b,m2),se=Math.sqrt(v1/n1+v2/n2);if(!se)return{diff:m2-m1,p:1,t:0,se:0,df:n1+n2-2};const t=(m2-m1)/se,df=(v1/n1+v2/n2)**2/((v1/n1)**2/(n1-1)+(v2/n2)**2/(n2-1));return{diff:m2-m1,t,df,se,p:pT(t,df)}}
function solve3(A,B){const M=A.map((r,i)=>[...r,B[i]]);for(let i=0;i<3;i++){let p=i;for(let r=i+1;r<3;r++)if(Math.abs(M[r][i])>Math.abs(M[p][i]))p=r;[M[i],M[p]]=[M[p],M[i]];const d=M[i][i]||1e-12;for(let c=i;c<4;c++)M[i][c]/=d;for(let r=0;r<3;r++)if(r!==i){const f=M[r][i];for(let c=i;c<4;c++)M[r][c]-=f*M[i][c]}}return[M[0][3],M[1][3],M[2][3]]}
function olsG(y,g,z){const A=[[0,0,0],[0,0,0],[0,0,0]],B=[0,0,0];for(let i=0;i<y.length;i++){const x=[1,g[i],z[i]];for(let r=0;r<3;r++){B[r]+=x[r]*y[i];for(let c=0;c<3;c++)A[r][c]+=x[r]*x[c]}}return solve3(A,B)[1]}
function powerAt(n,d,alpha,runs,seed){const N=mkN(rng(seed));let rej=0;for(let k=0;k<runs;k++){const a=[],b=[];for(let i=0;i<n;i++){a.push(N());b.push(N()+d)}const t=welch(a,b);if(t.p<alpha&&t.diff>0)rej++}return rej/runs}
function simulate(P){
 const N=mkN(rng(P.seed)),o={w1:{rej:0,est:[]},w2:{rej:0,est:[]},w3:{rej:0,est:[],adj:[]}};let guard=0;
 for(let k=0;k<P.runs;k++){
  let a=[],b=[];for(let i=0;i<P.n;i++){a.push(N());b.push(N()+P.d)}
  let t=welch(a,b);o.w1.est.push(t.diff);if(t.p<P.alpha&&t.diff>0)o.w1.rej++;
  a=[];b=[];for(let i=0;i<P.n;i++){a.push(N());b.push(N())}
  t=welch(a,b);o.w2.est.push(t.diff);if(t.p<P.alpha)o.w2.rej++;
  const y=[],g=[],z=[],ya=[],yb=[];
  for(let i=0;i<2*P.n;i++){const zi=N(),gi=(P.kappa*zi+N())>0?1:0,yi=P.d*gi+P.gamma*zi+N();y.push(yi);g.push(gi);z.push(zi);(gi?yb:ya).push(yi)}
  if((ya.length<3||yb.length<3)&&guard++<P.runs*5){k--;continue}
  if(ya.length<3||yb.length<3)continue;
  t=welch(ya,yb);o.w3.est.push(t.diff);if(t.p<P.alpha)o.w3.rej++;o.w3.adj.push(olsG(y,g,z));
 }
 const R=P.runs,nReq=Math.ceil(2*((invN(1-P.alpha/2)+invN(0.8))/P.d)**2),m3=mean(o.w3.est);
 return{P:{...P},power:o.w1.rej/R,typeI:o.w2.rej/R,rej3:o.w3.rej/o.w3.est.length,naive:m3,adj:mean(o.w3.adj),bias:m3-P.d,nReq,
  pReq:powerAt(Math.min(nReq,400),P.d,P.alpha,500,P.seed+1),pLo:powerAt(P.n,P.d*0.8,P.alpha,500,P.seed+2),pHi:powerAt(P.n,P.d*1.2,P.alpha,500,P.seed+3),h1:o.w1.est,h0:o.w2.est}}

/* ================= CONTENIDO PEDAGÓGICO ================= */

/* ================= CONSTRUCTORES DE FORMULARIO ================= */
const optPair=o=>Array.isArray(o)?o:[o,o];
const FLD=(p,l,o={})=>`<label class="f"><span>${l}${o.h?` <em>${o.h}</em>`:''}</span>${o.rows?`<textarea rows="${o.rows}" data-bind="${p}" placeholder="${esc(o.ph||'')}">${esc(get(p))}</textarea>`:`<input type="${o.type||'text'}" data-bind="${p}"${o.num?' data-num="1"':''}${o.step?` step="${o.step}"`:''} value="${esc(get(p))}" placeholder="${esc(o.ph||'')}">`}</label>`;
const SEL=(p,l,opts)=>`<label class="f"><span>${l}</span><select data-bind="${p}">${opts.map(optPair).map(o=>`<option value="${esc(o[0])}"${String(get(p))===String(o[0])?' selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`;
const claimOpts=()=>{const o=[['','Sin vincular']];S.afirm.forEach((a,i)=>{if(a.t.trim())o.push(['A'+(i+1),'A'+(i+1)+': '+trunc(a.t,50)])});if(S.h.texto.trim())o.push(['H','Hipótesis: '+trunc(S.h.texto,50)]);S.sup.forEach((a,i)=>{if(a.t.trim())o.push(['S'+(i+1),'S'+(i+1)+': '+trunc(a.t,50)])});return o};
const LDEF={
 afirm:[{k:'t',l:'Afirmación',rows:2},{k:'tipo',l:'Tipo',opts:ATIPOS}],
 actores:[{k:'n',l:'Actor o grupo'},{k:'rol',l:'Rol'},{k:'cons',l:'Consecuencia que experimenta',rows:2}],
 evid:[{k:'desc',l:'Qué es / qué dice',rows:2},{k:'fuente',l:'Fuente (la que tú tienes; la app no inventa fuentes)'},{k:'tipo',l:'Formato',opts:['Documento','Dato','Observación','Imagen','Testimonio']},{k:'clase',l:'Clase',opts:CLASES,def:'Documento o estudio'},{k:'vinc',l:'Respalda o cuestiona',opts:()=>claimOpts()}],
 factores:[{k:'t',l:'Factor'},{k:'rel',l:'Relación propuesta con el problema',opts:[['intensifica','lo intensifica'],['atenua','lo atenúa'],['asociado','está asociado'],['explorar','por explorar']],def:'explorar'}],
 consec:[{k:'t',l:'Consecuencia'},{k:'actor',l:'Quién la experimenta'}],
 sup:[{k:'t',l:'Supuesto o limitación',rows:2},{k:'tipo',l:'Tipo',opts:['Supuesto','Limitación','Condición']}],
 'vis.pasos':[{k:'t',l:'Paso',rows:2}]};
const LNAME={afirm:'Afirmación',actores:'Actor',evid:'Antecedente',factores:'Factor',consec:'Consecuencia',sup:'Supuesto','vis.pasos':'Paso'};
function newItem(path){const o={};LDEF[path].forEach(d=>{o[d.k]=d.def!==undefined?d.def:(d.opts&&typeof d.opts!=='function'?optPair(d.opts[0])[0]:'')});return o}
function LIST(path,empty){const arr=get(path),defs=LDEF[path],nm=LNAME[path];
 return(arr.length?arr.map((it,i)=>`<fieldset class="li"><legend>${nm} ${i+1}</legend><div class="grid2">${defs.map(d=>d.opts?SEL(`${path}.${i}.${d.k}`,d.l,typeof d.opts==='function'?d.opts():d.opts):FLD(`${path}.${i}.${d.k}`,d.l,{rows:d.rows})).join('')}</div><button class="btn sm gh" data-act="del" data-arg="${path}|${i}" aria-label="Quitar ${nm.toLowerCase()} ${i+1}">Quitar</button></fieldset>`).join(''):`<p class="mut">${empty||'Sin elementos todavía.'}</p>`)+`<button class="btn sm" data-act="add" data-arg="${path}">+ Agregar ${nm.toLowerCase()}</button>`}
const ADV=h=>S.modo==='avanzada'?h:'';
const exp=()=>S.enfoque==='expl';

/* ================= TUTOR (reglas locales) ================= */
function textDir(t){const n=norm(t);return{pos:foundExact(t,POSW).length>0,neg:foundExact(t,NEGW).length>0}}
function tutor(){
 const o=[],c=S.c,E=ENF[S.enfoque],h=S.h.texto,txt=exp()?S.pregunta:h;
 const A=(id,st,tipo,t,why,prop)=>o.push({id,st,tipo,t,why,prop});
 const obs=S.afirm.filter(a=>a.t.trim()&&a.tipo==='Observación');
 if(!S.p.ocurre.trim())A('p0',0,'Pregunta','¿Qué ocurre exactamente? Descríbelo sin incluir la causa ni la solución.','Un problema bien descrito se puede observar; una causa o solución supuesta cierra la investigación antes de empezar.');
 else if(/(falta de|debe(ria)?\b|hay que|necesitamos|se necesita|por culpa|porque no)/.test(norm(S.p.ocurre)))A('p1',0,'Ambigüedad','Tu descripción parece incluir una causa o una solución supuesta («falta de…», «hay que…»). ¿Qué hecho observable hay detrás?','Describir hechos separa el problema de las explicaciones que luego pondrás a prueba.');
 if(!obs.length)A('p2',0,'Distinción','Aún no registras observaciones. ¿Qué hecho concreto, que otra persona pudiera verificar, muestra que el problema existe?','Separar lo que se ve de lo que se interpreta evita partir de prejuicios.');
 if(S.afirm.some(a=>a.t.trim()&&a.tipo==='Observación'&&/(porque|debido|por culpa|flojos?|descuidad|siempre|nunca|todos)/.test(norm(a.t))))A('p3',0,'Distinción','Una afirmación marcada como «Observación» contiene una explicación o una generalización («porque», «siempre», «todos»). ¿Es un hecho o una interpretación?','Las interpretaciones pueden ser valiosas, pero deben rotularse para no confundirlas con hechos.');
 if(!S.ctx.donde.trim()||!S.ctx.cuando.trim())A('c0',1,'Falta información','Falta precisar '+[!S.ctx.donde.trim()&&'dónde',!S.ctx.cuando.trim()&&'cuándo'].filter(Boolean).join(' y ')+' ocurre.','Sin delimitar lugar y tiempo no se sabe dónde mirar ni hasta dónde llega una conclusión.');
 if(!ne(S.actores,'n').length)A('c1',1,'Pregunta','¿Quiénes viven el problema y quiénes toman decisiones sobre él?','Cada actor ve el problema distinto y eso cambia qué conviene medir.');
 S.actores.forEach((a,i)=>{if(a.n.trim()&&!a.cons.trim())A('c2_'+i,1,'Pregunta',`¿Qué le ocurre a «${a.n}» por causa del problema?`,'Las consecuencias humanas justifican la investigación y orientan los indicadores.')});
 if(!ne(S.evid,'desc').length)A('a0',2,'Falta información','Aún no registras antecedentes. Pueden ser registros, documentos o tu propia observación (rotulada como tal).','Saber qué existe evita investigar lo ya conocido y muestra dónde están los vacíos.');
 S.evid.forEach((e,i)=>{if(e.desc.trim()&&!e.fuente.trim())A('a1_'+i,2,'Falta información',`El antecedente ${i+1} no tiene fuente. ¿De dónde proviene? (La app no completa ni inventa fuentes).`,'Sin fuente nadie puede revisar el respaldo de una afirmación.')});
 if(!S.falta.trim())A('a2',2,'Pregunta','¿Qué te gustaría saber y todavía no sabes? Anotar los vacíos orienta qué datos faltan.','Los vacíos explícitos son el puente hacia la pregunta de investigación.');
 if(ne(S.factores,'t').length<2)A('d0',3,'Pregunta','¿Qué otros factores podrían intensificar o atenuar el problema? Hasta ahora identificas '+ne(S.factores,'t').length+'.','Un solo factor suele esconder alternativas; ver varios ayuda a no atribuir todo a una causa.');
 if(!ne(S.consec,'t').length)A('d1',3,'Pregunta','¿Qué consecuencias tiene el problema, y para quién?','Las consecuencias muestran por qué importa y qué resultados podrían medirse.');
 if(S.enfoque!=='causal'&&S.factores.some(f=>f.t.trim()&&['intensifica','atenua'].includes(f.rel)))A('d2',3,'Causalidad','Marcaste que algunos factores «intensifican» o «atenúan» el problema, pero tu enfoque es «'+E.n+'». ¿Tienes un diseño que permita hablar de efecto, o prefieres «está asociado»?','Afirmar efecto sin diseño que lo sostenga es el error más frecuente al pasar de una observación a una hipótesis.');
 if(!S.pregunta.trim())A('q0',4,'Pregunta','Escribe tu pregunta con tus palabras. ¿Qué quieres averiguar y en quiénes?','La pregunta orienta todo el diseño; si es difusa, la hipótesis también lo será.');
 else{
  if(!S.pregunta.includes('?'))A('q1',4,'Ambigüedad','Tu pregunta no está formulada como interrogante. ¿Puedes escribirla entre signos de interrogación?','Una pregunta clara se reconoce porque se puede imaginar su respuesta.');
  if(exp()&&/(efecto|causa|provoca|reduce|aumenta|impacto)/.test(norm(S.pregunta)))A('q2',4,'Contradicción','Elegiste un enfoque exploratorio, pero tu pregunta habla de efecto o causa. ¿Quieres cambiar el enfoque o reformular?','Las preguntas causales suponen una base que el enfoque exploratorio todavía no tiene.');
  if(S.pregunta.length>20&&c.x&&ovl(c.x,S.pregunta)<.2&&ovl(S.p.ocurre,S.pregunta)<.2)A('q3',4,'Contradicción','Tu pregunta comparte pocos términos con el problema y con tus componentes. ¿Sigue hablando de lo mismo?','Si la pregunta se aleja del problema descrito, la hipótesis responderá otra cosa.');
 }
 if(!exp()){
  const vag=vagueIn(h);
  vag.forEach(w=>A('h_v_'+w,5,'Ambigüedad',`«${w}» puede significar cosas distintas para distintas personas. ¿Qué observarías para decir que ocurrió?`,'Un término impreciso impide que otra persona repita tu estudio y reconozca cuándo la hipótesis falla.',c.y_ind.trim()?{path:'h.texto',mode:'replace',from:w,to:w+' (medida como: '+c.y_ind.trim()+')'}:null));
  if(foundExact(h,CONSTR).length&&!c.y_ind.trim())A('h_c',5,'Ambigüedad',`«${foundExact(h,CONSTR)[0]}» es un concepto amplio. ¿Qué indicador concreto lo representa?`,'Sin indicador no hay forma de saber si el concepto cambió.');
  const cw=CAUSAL.filter(w=>norm(h).includes(w));
  if(cw.length&&S.enfoque!=='causal')A('h_ca',5,'Causalidad',`Usas lenguaje causal («${cw[0]}») con un enfoque de «${E.n}». ¿Puedes sostener una relación causal con ese diseño?`,'Los verbos causales prometen más de lo que una asociación o una comparación pueden respaldar.');
  if(cw.length&&S.enfoque==='causal'&&!c.conf.trim())A('h_cb',5,'Causalidad','Afirmas un efecto, pero no has nombrado explicaciones alternativas (confusoras). ¿Qué más podría producir el mismo resultado?','Una relación causal es creíble en la medida en que se descartan explicaciones rivales.');
  const td=textDir(h);if(c.dir&&h.trim()){if(sgn()<0&&td.pos&&!td.neg)A('h_d',5,'Contradicción','Elegiste una dirección descendente, pero el texto usa palabras de aumento. ¿Cuál es la correcta?','El texto y los componentes deben decir lo mismo; si no, el diagrama y la revisión se contradicen.');
   if(sgn()>0&&td.neg&&!td.pos)A('h_d2',5,'Contradicción','Elegiste una dirección ascendente, pero el texto usa palabras de disminución. ¿Cuál es la correcta?','El texto y los componentes deben decir lo mismo.')}
  if(h.trim()&&c.x&&ovl(c.x,h)<.4)A('h_x',5,'Pregunta',`Tu texto no nombra con claridad «${trunc(c.x,50)}». ¿Es el mismo elemento con otro nombre?`,'Un mismo concepto con dos nombres hace creer que hay dos conceptos.');
  if(h.trim()&&c.y&&ovl(c.y,h)<.4&&ovl(c.y_ind,h)<.4)A('h_y',5,'Pregunta',`Tu texto no nombra con claridad «${trunc(c.y,50)}». ¿Es el mismo elemento con otro nombre?`,'La hipótesis debe hablar del mismo resultado que vas a medir.');

/* ================= ETAPAS (panel de construcción) ================= */
const HEAD=i=>`<div class="card pri"><h2>Etapa ${i+1} de 10 · ${ST[i].n}</h2><p><b>${ST[i].q}</b></p></div>`;
const NAV=i=>`<div class="row" style="margin-bottom:14px">${i>0?`<button class="btn gh" data-act="stage" data-arg="${i-1}">← ${ST[i-1].s}</button>`:''}<span class="sp"></span>${i<9?`<button class="btn" data-act="stage" data-arg="${i+1}">${ST[i+1].s} →</button>`:''}</div>`;
function enfSel(){return SEL('enfoque','Tipo de estudio que imaginas',Object.entries(ENF).map(([k,v])=>[k,v.n]))+`<p class="mut"><small>${esc(ENF[S.enfoque].nota)}</small></p>`}
function s0(){return HEAD(0)+`<div class="card">${enfSel()}${FLD('p.ocurre','¿Qué ocurre?',{rows:3,h:'hechos observables, sin causa ni solución',ph:'En la bodega, dos operarios por mes piden licencia por dolor de espalda.'})}${FLD('p.porque','¿Por qué merece investigarse?',{rows:2,ph:'Genera costos, riesgo legal y afecta a las personas.'})}</div>`
 +`<div class="card"><h3>Registro de afirmaciones</h3><p class="mut">Separa lo que se ve, lo que se interpreta, lo que se supone y lo que se predice.</p>${LIST('afirm','Aún no registras afirmaciones.')}</div>`+NAV(0)}
function s1(){return HEAD(1)+`<div class="card"><div class="grid2">${FLD('ctx.donde','¿Dónde ocurre?',{ph:'Bodega de una constructora mediana, RM'})}${FLD('ctx.cuando','¿Cuándo / con qué frecuencia?',{ph:'Todo el año, más en temporada alta'})}</div>${FLD('ctx.circ','¿En qué circunstancias?',{rows:2,ph:'Turnos de día, carga manual sin ayudas mecánicas'})}${FLD('c.unidad','¿A quiénes afecta? (unidad de análisis)',{ph:'Operarios de bodega'})}</div>`
 +`<div class="card"><h3>Actores y consecuencias</h3>${LIST('actores','Aún no registras actores.')}</div>`+NAV(1)}
function s2(){return HEAD(2)+`<div class="card"><h3>Antecedentes disponibles</h3><div class="note">Registra solo lo que tienes. La plataforma <b>no busca ni inventa fuentes</b>; si no tienes una fuente, déjala vacía y quedará señalada.</div>${LIST('evid','Aún no registras antecedentes.')}</div>`+`<div class="card">${FLD('falta','¿Qué falta conocer?',{rows:3,ph:'No sabemos qué tareas concentran los episodios ni si el taller anterior cambió algo.'})}</div>`+NAV(2)}
function s3(){return HEAD(3)+`<div class="card"><h3>Factores</h3><p class="mut">Cada factor es algo que podría intensificar o atenuar el problema. Marca cuánto sabes: «por explorar» es una respuesta válida.</p>${LIST('factores')}</div><div class="card"><h3>Consecuencias</h3>${LIST('consec')}</div>`+NAV(3)}
function s4(){const E=ENF[S.enfoque];return HEAD(4)+`<div class="card">${enfSel()}${FLD('pregunta','Tu pregunta de investigación',{rows:3,ph:'¿Difiere la frecuencia de dolor lumbar entre operarios que asisten a un taller de levante y los que no, en 3 meses?'})}${SEL('pregTipo','Tipo de pregunta',[['','—'],['exploratoria','Exploratoria (¿qué ocurre? ¿cómo es?)'],['descriptiva','Descriptiva (¿cuánto? ¿con qué frecuencia?)'],['comparativa','Comparativa (¿difiere?)'],['asociacion','De asociación (¿se relacionan?)'],['explicativa','Explicativa (¿produce? ¿por qué?)']])}`
 +(E.hip?'<div class="note p">Con este enfoque el siguiente paso es una hipótesis.</div>':'<div class="note p">Con un enfoque exploratorio no se exige hipótesis: tu pregunta es el producto central. Puedes saltar a la etapa 8.</div>')+`</div>`+NAV(4)}
function altCards(){if(!S.ui.alt)return '';const a=alternativas();if(!a.length)return '<p class="mut">No hay alternativas para este enfoque.</p>';
 return a.map((x,i)=>`<div class="hint"><b>Alternativa ${i+1}</b><p>${esc(x.t)}</p><p class="mut"><small><b>Qué cambia:</b> ${esc(x.q)}</small></p><div class="row"><button class="btn sm" data-act="altok" data-arg="${i}">Aceptar</button><button class="btn sm gh" data-act="altmod" data-arg="${i}">Modificar</button><button class="btn sm gh" data-act="altno" data-arg="${i}">Rechazar</button></div></div>`).join('')}
function alternativas(){const c=S.c,e=S.enfoque,u=(c.unidad?c.unidad.charAt(0).toLowerCase()+c.unidad.slice(1):'[unidad]'),x=c.x||'[factor]',y=c.y_ind||c.y||'[resultado]',t=c.tiempo?' '+c.tiempo:'',dn=sgn()<0,cf=lines(c.conf)[0]||'';
 if(e==='causal')return[{t:`En ${u}, quienes estén expuestos a «${x}» presentarán ${dn?'menor':'mayor'} «${y}» que quienes no lo estén${t}.`,n:`No habrá diferencia en «${y}» entre expuestos y no expuestos a «${x}», o será ${dn?'mayor':'menor'}${t}.`,q:'Direccional: apuesta por un sentido. Es más fácil de refutar (si ocurre lo contrario se cuestiona) pero arriesga más.'},{t:`En ${u}, habrá diferencia en «${y}» entre quienes estén expuestos a «${x}» y quienes no${t}.`,n:`No habrá diferencia en «${y}» entre expuestos y no expuestos${t}.`,q:'No direccional: más segura pero dice menos; casi cualquier resultado la confirma. Úsala si aún no tienes fundamento para el sentido.'},{t:`En ${u}, «${x}» se asociará con ${dn?'menor':'mayor'} «${y}»${t}${c.mec?', a través de «'+c.mec+'»':cf?', una vez considerado «'+cf+'»':''}.`,n:`«${x}» no se asociará con «${y}»${t}${cf?', una vez considerado «'+cf+'»':''}.`,q:'Condicionada: añade un mecanismo o un control. Afina el alcance pero obliga a medir esa pieza adicional.'}];
 if(e==='asoc')return[{t:`En ${u}, «${x}» y «${y}» estarán asociadas ${c.dir==='neg'?'en sentido contrario':'en el mismo sentido'}${t}.`,n:`«${x}» y «${y}» no estarán asociadas${t}.`,q:'Direccional: define el sentido de la asociación. Sigue sin hablar de causa.'},{t:`En ${u}, existirá asociación entre «${x}» y «${y}»${t}.`,n:`No existirá asociación entre «${x}» y «${y}»${t}.`,q:'No direccional: casi cualquier resultado distinto de cero la confirma.'}];
 if(e==='comp')return[{t:`En ${u}, el grupo «${x}» tendrá ${dn?'menores':'mayores'} valores de «${y}» que el grupo de comparación${t}.`,n:`No habrá diferencia en «${y}» entre grupos, o será ${dn?'mayor':'menor'} en «${x}»${t}.`,q:'Direccional: apuesta por qué grupo tiene más. Más fácil de refutar.'},{t:`En ${u}, los grupos diferirán en «${y}»${t}.`,n:`No habrá diferencia en «${y}» entre los grupos${t}.`,q:'No direccional: más segura, dice menos.'}];
 return[]}
function s5(){const E=ENF[S.enfoque],draft=wc(S.h.texto)>=6;
 if(!E.hip)return HEAD(5)+`<div class="card"><div class="note p">Tu enfoque es exploratorio: no se exige hipótesis. Define las categorías que explorarás y, si quieres, proposiciones guía.</div>${FLD('c.x','Categorías o dimensiones (una por línea)',{rows:4})}${FLD('h.texto','Proposiciones guía o preguntas específicas (opcional)',{rows:3})}${FLD('c.conf','Condiciones o factores a registrar (una por línea)',{rows:3})}${FLD('c.refuta','¿Qué hallazgo te haría replantear la pregunta?',{rows:2})}</div>`+NAV(5);
 return HEAD(5)+`<div class="card acc"><h3>1 · Tu intento, con tus palabras</h3><p class="mut">Escribe primero tu versión. Las alternativas de redacción aparecen <b>después</b> de que lo intentes.</p>${FLD('h.texto','Tu hipótesis',{rows:3})}<small id="wcH" class="mut"></small>${FLD('h.nula','Hipótesis nula (qué ocurriría si tu idea fuera falsa)',{rows:2})}${ADV(FLD('h.cot','Versión en palabras cotidianas (≤25 palabras, opcional)',{rows:2}))}<h4>Descomposición de tu texto</h4><div id="hl">${hlHTML()}</div>`
 +`<div class="row"><button class="btn acc sm" data-act="alt"${draft?'':' disabled'}>Ver alternativas de redacción</button>${draft?'':'<small class="mut">Se habilita cuando escribas un borrador (≥ 6 palabras).</small>'}</div><div id="altc">${altCards()}</div></div>`
 +`<div class="card"><h3>2 · Piezas de tu hipótesis</h3><p class="mut">Cada pieza responde una decisión. Si te trabas, usa las preguntas del panel derecho.</p><div class="grid2"><div>${FLD('c.unidad','¿En quiénes? (unidad de análisis)')}${FLD('c.tiempo','¿Cuándo / horizonte temporal?')}${FLD('c.x',E.x)}${ADV(FLD('c.x_inst','Cómo se registra / define '+E.x.toLowerCase()))}${FLD('c.x_ind','Indicador de '+E.x.toLowerCase())}</div><div>${FLD('c.y',E.y)}${FLD('c.y_ind','Indicador de '+E.y.toLowerCase())}${FLD('c.y_inst','Instrumento de '+E.y.toLowerCase())}${ADV(FLD('c.y_esc','Escala de '+E.y.toLowerCase(),{ph:'conteo, 1–7, sí/no…'}))}${SEL('c.dir','Dirección esperada',[['','—'],...E.dirs])}</div></div>`
 +(E.mec?ADV(FLD('c.mec','Mecanismo (cómo se propone que ocurre) · opcional',{rows:2})):'')+FLD('c.conf',E.conf+' (una por línea)',{rows:3})+FLD('c.fund','Fundamento: ¿por qué esperas esta relación?',{rows:3,h:'razón conceptual; no equivale a validez'})+FLD('c.refuta','¿Qué resultado cuestionaría tu hipótesis?',{rows:2,ph:'Si no hay diferencia o es contraria al sentido esperado…'})+ADV(FLD('c.alcance','Alcance de la hipótesis',{rows:2})+FLD('c.limit','Limitaciones previstas',{rows:2}))+`</div>`
 +`<div class="card"><h3>3 · Supuestos y limitaciones</h3>${LIST('sup','Aún no registras supuestos.')}</div>`
 +`<div class="card"><h3>Matriz de variables e indicadores</h3><div id="matriz">${matrizHTML()}</div></div>`+NAV(5)}
function matrizHTML(){const c=S.c,E=ENF[S.enfoque];return `<table class="t"><tr><th>Elemento</th><th>Rol</th><th>Indicador</th><th>Instrumento</th><th>Escala</th></tr><tr><td>${esc(c.x)||'—'}</td><td>${esc(E.x)}</td><td>${esc(c.x_ind)||'—'}</td><td>${esc(c.x_inst)||'—'}</td><td>—</td></tr>${E.y?`<tr><td>${esc(c.y)||'—'}</td><td>${esc(E.y)}</td><td>${esc(c.y_ind)||'—'}</td><td>${esc(c.y_inst)||'—'}</td><td>${esc(c.y_esc)||'—'}</td></tr>`:''}${lines(c.conf).map(k=>`<tr><td>${esc(k)}</td><td>${esc(E.conf.split('(')[0].trim())}</td><td>—</td><td>—</td><td>—</td></tr>`).join('')}</table>`}
function hlHTML(){const t=S.h.texto;if(!t.trim())return '<p class="mut">Escribe tu hipótesis para ver su descomposición.</p>';
 const c=S.c,sets=[['Unidad',toks(c.unidad),'#0369a1'],[ENF[S.enfoque].x,toks(c.x+' '+c.x_ind),'#6B21A8'],[ENF[S.enfoque].y||'Resultado',toks(c.y+' '+c.y_ind),'#c2410c'],['Horizonte',toks(c.tiempo),'#854d0e'],['Control',toks(c.conf),'#b91c1c'],['Mecanismo',toks(c.mec),'#0e7490']];const used=new Map();
 const out=t.split(/(\s+)/).map(w=>{if(!w.trim())return esc(w);const s=toks(w)[0];if(s)for(const [k,set,col] of sets)if(set.includes(s)){used.set(k,col);return `<span class="hl" style="background:${col}22;border-bottom:2px solid ${col}">${esc(w)}</span>`}
  const nw=norm(w).replace(/[^a-z]/g,'');if(POSW.includes(nw)||NEGW.includes(nw)){used.set('Dirección','#166534');return `<span class="hl" style="background:#16653422;border-bottom:2px solid #166534">${esc(w)}</span>`}return esc(w)}).join('');
 const need=['Unidad',ENF[S.enfoque].x,ENF[S.enfoque].y||'Resultado','Horizonte','Dirección'].filter(k=>!used.has(k));
 return `<p style="line-height:2">${out}</p><div>${[...used].map(([k,col])=>`<span class="chip"><i class="sw" style="background:${col}"></i>${esc(k)}</span>`).join('')}</div>`+(need.length?`<div class="note">No aparece en el texto: <b>${esc(need.join(', '))}</b>. ¿Falta realmente o está implícito?</div>`:'<div class="note p">Todas las piezas centrales aparecen en el texto.</div>')}
function s6(){const R=revisar();const cnt=t=>R.filter(r=>r.tono===t).length;
 return HEAD(6)+`<div class="card"><div class="warn">Estos estados describen la <u>formulación</u>. No indican que la hipótesis sea verdadera ni que esté validada: eso solo puede decirlo la contrastación con evidencia.</div><p><span class="chip ok">✓ ${cnt('ok')} consistentes</span><span class="chip at">◐ ${cnt('at')} requieren precisión</span><span class="chip pe">○ ${cnt('pe')} con algo por definir</span></p></div>`
 +R.map(r=>{const d=S.rev[r.id]||{};return `<div class="card"><div class="row"><h3 style="margin:0" class="sp">${r.n}</h3><span class="chip ${TONO[r.tono][1]}">${TONO[r.tono][0]} ${esc(r.estado)}</span></div><dl class="rv"><dt>Qué se está revisando</dt><dd>${esc(r.que)}</dd><dt>Qué requiere atención</dt><dd>${esc(r.aten)}</dd><dt>Por qué es importante</dt><dd>${esc(r.porq)}</dd><dt>Qué cambio se propone</dt><dd>${esc(r.camb)}</dd></dl><fieldset class="li"><legend>Tu decisión</legend><div class="row">${[['acepto','Acepto el cambio'],['pospongo','Lo dejo para después'],['nocomparto','No lo comparto']].map(o=>`<label><input type="radio" name="rv_${r.id}" value="${o[0]}" data-bind="rev.${r.id}.dec"${d.dec===o[0]?' checked':''}> ${o[1]}</label>`).join('')}</div>${FLD('rev.'+r.id+'.nota','Nota o fundamento de tu decisión')}</fieldset></div>`}).join('')+NAV(6)}
function s7(){const sl=stale();
 return HEAD(7)+`<div class="card"><p>Mira el <b>lienzo</b>: mapa del problema, diagrama de variables y escena se dibujan con lo que escribiste. Pregúntate qué ves ahí que el texto no decía.</p>${sl&&sl.length?`<div class="warn">Requieren actualización: ${esc(sl.join('; '))}.</div>`:(S.vis.snap?'<div class="note p">Los visuales coinciden con tu última confirmación.</div>':'<div class="note">Aún no confirmas que los visuales reflejan tu formulación.</div>')}<button class="btn" data-act="snap">Confirmar que los visuales están al día</button></div>`
 +`<div class="card"><h3>Secuencia: ¿cómo se propone que ocurre?</h3><p class="mut">Pasos hipotéticos, uno por caja. No describen hechos.</p>${LIST('vis.pasos')}</div>`
 +`<div class="card"><h3>Comparación de situaciones</h3>${FLD('vis.actual','Situación actual',{rows:2})}${FLD('vis.posible','Situación posible si la propuesta se sostuviera',{rows:2})}<p class="mut"><small>Se muestran en la pestaña «Escenarios» del lienzo.</small></p></div>`+NAV(7)}
function simRes(){const r=S.sim.res;if(!r)return '<p class="mut">Aún no corres la simulación.</p>';const p=S.sim.pred,dif=p!=null?Math.abs(p-r.power*100):null;
 return rateSVG(r)+histSVG(r)+`<div class="warn">SINTÉTICO — NO ES EVIDENCIA EMPÍRICA. Evalúa el <b>diseño</b>, no la hipótesis.</div><table class="t"><tr><th>Pregunta</th><th>Resultado simulado</th></tr><tr><td>¿Detecta el efecto supuesto (${r.P.d} DE) con n=${r.P.n} por grupo?</td><td><b>${Math.round(r.power*100)} %</b> (meta ≥ 80 %)</td></tr><tr><td>Falsas alarmas si H0 fuera cierta (esperado ≈ ${Math.round(r.P.alpha*100)} %)</td><td>${(r.typeI*100).toFixed(1)} %</td></tr><tr><td>n por grupo para poder ≈ 80 % (aprox. normal)</td><td><b>${r.nReq}</b> · simulado: ${Math.round(r.pReq*100)} %</td></tr><tr><td>Si el efecto real fuera 20 % menor / mayor</td><td>poder ${Math.round(r.pLo*100)} % / ${Math.round(r.pHi*100)} %</td></tr><tr><td>Con confusora sin controlar (verdad = ${r.P.d})</td><td>diferencia ingenua <b>${r.naive.toFixed(2)}</b> (sesgo ${r.bias>=0?'+':''}${r.bias.toFixed(2)}) · ajustada <b>${r.adj.toFixed(2)}</b></td></tr></table>`
 +(dif!=null?`<div class="note p"><b>Tu predicción:</b> ${p} % · <b>simulado:</b> ${Math.round(r.power*100)} % · diferencia ${Math.round(dif)} puntos. ${dif<=10?'Buena intuición.':'Gran diferencia: ¿qué supuesto no habías considerado?'}</div>`:'')+FLD('sim.expl','Explica con tus palabras la diferencia entre tu predicción y lo simulado',{rows:2})}
function s8(){const s=S.sim;
 return HEAD(8)+`<div class="card"><h3>Qué datos necesitas y cómo los obtendrías</h3>${FLD('con.datos','Datos, observaciones o mediciones necesarias',{rows:3,ph:'Conteo semanal de episodios de dolor ≥3/10 por operario; asistencia al taller.'})}<div class="grid2">${FLD('con.muestra','¿A quiénes y cuántos?')}${FLD('con.analisis','¿Cómo compararás los resultados?')}</div>${FLD('con.viab','Viabilidad: tiempo, costo, acceso',{rows:2})}</div>`
 +`<div class="card"><h3>Cómo se interpretarían los resultados</h3><p class="mut">Descríbelo <b>antes</b> de ver datos. Se muestra en la pestaña «Escenarios».</p>${FLD('esc.compat','Resultados compatibles con la hipótesis',{rows:2})}${FLD('esc.cuestiona','Resultados que la cuestionan',{rows:2})}${FLD('esc.mixto','Resultados mixtos o inconclusos',{rows:2})}${FLD('esc.alterna','Explicaciones alternativas',{rows:2})}${FLD('esc.imprev','Consecuencias no previstas',{rows:2})}</div>`
 +`<div class="card"><h3>Riesgos éticos y privacidad</h3>${FLD('con.riesgos','Riesgos para las personas',{rows:2})}${FLD('con.priv','Privacidad y consentimiento',{rows:2})}</div>`
 +`<div class="card acc"><details${S.modo==='avanzada'?' open':''}><summary>Opcional · Sensibilidad del diseño con datos sintéticos <span class="chip sim">simulado</span></summary><p>Pregunta qué tan probable sería <i>detectar</i> un efecto si existiera, con supuestos que tú eliges. <b>No contrasta tu hipótesis.</b> Primero predice.</p>`
 +`<label class="f"><span>Predicción: ¿en qué % de estudios como el tuyo se detectaría un efecto real? <b id="predv">${s.pred==null?'—':s.pred+' %'}</b></span><input type="range" min="0" max="100" step="5" value="${s.pred==null?50:s.pred}" id="predr" aria-label="Predicción de poder en porcentaje"></label><button class="btn sm" data-act="fixpred">Fijar mi predicción</button>`
 +`<div class="grid2" style="margin-top:8px">${FLD('sim.n','n por grupo',{type:'number',num:1})}${FLD('sim.d','Efecto supuesto (desviaciones estándar)',{type:'number',num:1,step:'0.1',h:'0.2 pequeño · 0.5 medio · 0.8 grande'})}${ADV(FLD('sim.alpha','α',{type:'number',num:1,step:'0.01'})+FLD('sim.gamma','Fuerza de la confusora sobre el resultado',{type:'number',num:1,step:'0.1'})+FLD('sim.kappa','Fuerza de la confusora sobre quién recibe el factor',{type:'number',num:1,step:'0.1'})+FLD('sim.runs','Repeticiones',{type:'number',num:1}))}</div><div class="note"><b>Supuestos:</b> datos normales, varianzas iguales, efecto único y constante.</div><button class="btn acc" data-act="runsim"${s.pred==null?' disabled':''}>Correr simulación</button> ${s.pred==null?'<small class="mut">Fija tu predicción primero.</small>':''}<div id="simres">${simRes()}</div></details></div>`+NAV(8)}
function diffRows(a,b){const F=[['Enfoque',v=>v.snap.enfoque],['Pregunta',v=>v.snap.pregunta],['Hipótesis / proposición',v=>v.snap.texto],['Hipótesis nula',v=>v.snap.nula],['Unidad',v=>v.snap.c.unidad],['Horizonte',v=>v.snap.c.tiempo],['Factor / elemento 1',v=>v.snap.c.x],['Resultado / elemento 2',v=>v.snap.c.y],['Dirección',v=>v.snap.c.dir],['Mecanismo',v=>v.snap.c.mec],['Confusoras / controles',v=>v.snap.c.conf],['Indicador 1',v=>v.snap.c.x_ind],['Indicador 2',v=>v.snap.c.y_ind],['Instrumento',v=>v.snap.c.y_inst],['Qué la cuestionaría',v=>v.snap.c.refuta],['Supuestos',v=>v.snap.sup]];
 return F.map(([n,f])=>[n,f(a)||'',f(b)||'']).filter(r=>r[1]!==r[2])}
function s9(){const V=S.vers,deliv=[['Ficha del problema',!!S.p.ocurre.trim()],['Pregunta de investigación',!!S.pregunta.trim()],['Hipótesis y componentes',!!(S.h.texto.trim()||exp())],['Representación visual',!!S.vis.snap],['Matriz de variables e indicadores',!!(S.c.x_ind||S.c.y_ind)],['Supuestos y limitaciones',ne(S.sup,'t').length>0],['Propuesta de contrastación',!!(S.con.muestra&&S.con.analisis)],['Escenarios de resultados',Object.values(S.esc).some(x=>x.trim())],['Historial de versiones',V.length>0],['Reflexión sobre lo aprendido',Object.values(S.refl).every(x=>x.trim().length>=40)]];
 const a=V[+S.ui.cmpA],b=V[+S.ui.cmpB];
 return HEAD(9)+`<div class="card acc"><h3>Guardar versión V${V.length+1}</h3>${FLD('vcambio','¿Qué cambió y por qué?',{rows:2})}${FLD('vcoment','Retroalimentación recibida (de quién y qué dijo)',{rows:2})}${FLD('vfund','Fundamento de la decisión',{rows:2})}<button class="btn" data-act="savever">Guardar versión</button></div>`
 +`<div class="card"><h3>Comparar versiones</h3>${V.length>=2?`<div class="grid2">${SEL('ui.cmpA','Versión A',V.map((v,i)=>[i,'V'+(i+1)]))}${SEL('ui.cmpB','Versión B',V.map((v,i)=>[i,'V'+(i+1)]))}</div><div id="cmp">${cmpHTML(a,b)}</div>`:'<p class="mut">Guarda al menos dos versiones para compararlas.</p>'}${V.length?`<table class="t"><tr><th>V</th><th>Qué cambió</th><th>Retroalimentación</th><th>Fundamento</th></tr>${V.map((v,i)=>`<tr><td>V${i+1}</td><td>${esc(v.cambio)}</td><td>${esc(v.coment)}</td><td>${esc(v.fund)}</td></tr>`).join('')}</table>`:''}</div>`
